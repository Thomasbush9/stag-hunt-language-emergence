[project]
name = "stag-hunt-language-emergence"
version = "0.1.0"
description = "An embodied multi-agent RL environment for causal studies of emergent communication."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "gymnasium>=1.1,<2",
    "numpy>=2.0,<3",
    "pettingzoo>=1.25,<2",
    "torch>=2.6,<3",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
stag-hunt-random-rollout = "stag_hunt_lang.cli:main"
stag-hunt-torch-rollout = "stag_hunt_lang.torch_cli:main"
stag-hunt-inspect = "stag_hunt_lang.world_cli:main"
stag-hunt-figures = "stag_hunt_lang.figures:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stag_hunt_lang"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
